{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: postk8s
    name: postk8s-mail-viewer-role
rules:
    - apiGroups:
        - mail.circa10a.github.io
      resources:
        - mails
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - mail.circa10a.github.io
      resources:
        - mails/status
      verbs:
        - get
{{- end }}
